name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Static checks
        run: |
          python -m py_compile src/core.py src/server.py src/main.py
          node --check src/assets/web/app.js

      - name: Build exe
        run: pyinstaller --noconfirm --clean WebcastMateCapture.spec

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "dist/WebcastMateCapture.exe"
          if (-not (Test-Path $exe)) { throw "exe not produced" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "built $exe ($mb MB)"
          if ($mb -lt 10) { throw "exe suspiciously small: $mb MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: WebcastMateCapture-windows-x64
          path: dist/WebcastMateCapture.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WebcastMateCapture.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
