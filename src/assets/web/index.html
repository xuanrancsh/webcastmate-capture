<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抓取直播伴侣画面</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ───────────────────────── title bar ───────────────────────── -->
<header class="titlebar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="24" y2="24">
          <stop offset="0" stop-color="#5aa2ff"/>
          <stop offset="1" stop-color="#a855f7"/>
        </linearGradient>
      </defs>
      <rect x="2.2" y="5.2" width="14" height="13.6" rx="3.2"
            stroke="url(#lg)" stroke-width="1.6"/>
      <path d="M16.4 10.6l4.2-2.6c.6-.4 1.4 0 1.4.8v6.4c0 .8-.8 1.2-1.4.8l-4.2-2.6z"
            stroke="url(#lg)" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="9.2" cy="12" r="2.1" fill="url(#lg)" opacity=".85"/>
    </svg>
    <div class="brand-txt">
      <strong>抓取直播伴侣画面</strong>
      <span>WebcastMate Capture</span>
    </div>
  </div>

  <div class="drag-hint"></div>

  <div class="win-ctl">
    <button class="wc" data-act="minimize" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 12 12"><path d="M2.5 6h7" stroke="currentColor"
        stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <button class="wc close" data-act="close" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor"
        stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <!-- ───────────────────────── rail ───────────────────────── -->
  <nav class="rail">
    <button class="nav on" data-view="capture" title="抓取">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.6"
        stroke="currentColor" stroke-width="1.6" fill="none"/>
        <path d="M15.8 11l5-2.8v7.6l-5-2.8z" stroke="currentColor" stroke-width="1.6"
        fill="none" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav" data-view="settings" title="设置">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1"
        stroke="currentColor" stroke-width="1.6"/>
        <path d="M19.2 14.7a1.6 1.6 0 0 0 .32 1.77l.06.06a1.95 1.95 0 1 1-2.76 2.76l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a1.95 1.95 0 1 1-3.9 0v-.1a1.6 1.6 0 0 0-1.04-1.46 1.6 1.6 0 0 0-1.77.32l-.06.06a1.95 1.95 0 1 1-2.76-2.76l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97H3a1.95 1.95 0 1 1 0-3.9h.1a1.6 1.6 0 0 0 1.46-1.04 1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.95 1.95 0 1 1 2.76-2.76l.06.06a1.6 1.6 0 0 0 1.77.32h.08a1.6 1.6 0 0 0 .97-1.47V3a1.95 1.95 0 1 1 3.9 0v.1a1.6 1.6 0 0 0 .97 1.46 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.95 1.95 0 1 1 2.76 2.76l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97H21a1.95 1.95 0 1 1 0 3.9h-.1a1.6 1.6 0 0 0-1.46.97z"
        stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav" data-view="logs" title="日志">
      <svg viewBox="0 0 24 24"><path d="M4.5 5.5h15M4.5 12h15M4.5 18.5h9"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <div class="rail-admin" id="admin-dot" title="权限"></div>
  </nav>

  <!-- ───────────────────────── main ───────────────────────── -->
  <main>
    <!-- capture -->
    <section class="view on" id="view-capture">
      <div class="stage" id="stage">
        <img id="preview" alt="">
        <div class="ph" id="placeholder">
          <svg viewBox="0 0 48 48" class="ph-icon">
            <rect x="5" y="12" width="27" height="24" rx="5" stroke="currentColor"
              stroke-width="1.6" fill="none" opacity=".45"/>
            <path d="M33 21l9-5v16l-9-5z" stroke="currentColor" stroke-width="1.6"
              fill="none" opacity=".45" stroke-linejoin="round"/>
          </svg>
          <p class="ph-title">等待画面</p>
          <p class="ph-sub">点「开始抓取」后，直播伴侣的合成画面会出现在这里</p>
        </div>

        <div class="stage-top">
          <span class="pill" id="pill-state"><i></i><b>未启动</b></span>
          <span class="pill ghost" id="pill-res" hidden></span>
        </div>

        <div class="progress-wrap" id="progress-wrap" hidden>
          <div class="progress"><div class="bar" id="progress-bar"></div></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><span>画布尺寸</span><b id="s-canvas">—</b></div>
        <div class="stat"><span>比例</span><b id="s-aspect">—</b></div>
        <div class="stat"><span>预览帧率</span><b id="s-fps">—</b></div>
        <div class="stat"><span>窗口缩放</span><b id="s-scale">—</b></div>
        <div class="stat wide"><span>状态</span><b id="s-msg" class="msg">就绪</b></div>
      </div>

      <div class="actions">
        <button id="btn-start" class="btn primary">
          <svg viewBox="0 0 16 16"><path d="M5 3.6l7.2 4.4L5 12.4z" fill="currentColor"/></svg>
          开始抓取
        </button>
        <button id="btn-stop" class="btn" disabled>
          <svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.6"
            fill="currentColor"/></svg>
          停止并还原
        </button>
        <button id="btn-snap" class="btn ghost" disabled>
          <svg viewBox="0 0 16 16"><path d="M2.5 5.5h2.2l1-1.6h4.6l1 1.6h2.2v7.4H2.5z"
            stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
            <circle cx="8" cy="9" r="2.3" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          保存截图
        </button>
        <div class="spacer"></div>
        <button id="btn-help" class="btn tiny ghost">使用说明</button>
      </div>
    </section>

    <!-- settings -->
    <section class="view" id="view-settings">
      <div class="card">
        <div class="card-h">
          <h3>安装位置</h3>
          <button class="btn tiny" id="btn-locate">自动检测</button>
        </div>
        <p class="hint">程序会自动查找直播伴侣。找不到时，把安装目录粘到下面（例如
          <code>D:\webcast_mate\13.2.1\resources\app\index.js</code>）。</p>
        <div class="row">
          <input id="in-path" class="input" readonly>
          <button class="btn tiny ghost" id="btn-browse">手动指定…</button>
        </div>
        <div class="row">
          <button class="btn tiny" id="btn-inject">仅注入</button>
          <button class="btn tiny" id="btn-restore">仅还原</button>
          <button class="btn tiny ghost" id="btn-open-data">打开数据目录</button>
        </div>
      </div>

      <div class="card">
        <div class="card-h"><h3>预览</h3></div>
        <label class="field">
          <span>预览宽度 <b><output id="o-maxw">1280</output> px</b></span>
          <input type="range" id="r-maxw" min="480" max="1920" step="80">
        </label>
        <label class="field">
          <span>画质 <b><output id="o-q">72</output>%</b></span>
          <input type="range" id="r-q" min="30" max="95" step="1">
        </label>
        <label class="field">
          <span>预览帧率 <b><output id="o-fps">25</output> fps</b></span>
          <input type="range" id="r-fps" min="5" max="60" step="1">
        </label>
        <p class="hint">降低预览宽度和帧率能明显减少 CPU 占用。截图始终是原始分辨率。</p>
      </div>

      <div class="card">
        <div class="card-h">
          <h3>关于</h3>
          <span class="ver-tag" id="about-ver">v—</span>
        </div>
        <div class="kv"><span>钩子目录</span><code id="about-hook">—</code></div>
        <div class="kv"><span>数据目录</span><code id="about-data">—</code></div>
        <div class="row">
          <button class="btn tiny ghost" id="btn-github">项目主页</button>
          <button class="btn tiny ghost" id="btn-open-hook">打开钩子目录</button>
        </div>
        <p class="hint">本工具只在你的本机修改直播伴侣的入口文件，不联网、不上传任何数据。
          卸载前请点一次「仅还原」。</p>
      </div>
    </section>

    <!-- logs -->
    <section class="view" id="view-logs">
      <div class="card grow">
        <div class="card-h">
          <h3>运行日志</h3>
          <div class="row tight">
            <button class="btn tiny ghost" id="btn-log-clear">清空视图</button>
            <button class="btn tiny ghost" id="btn-log-copy">复制</button>
          </div>
        </div>
        <pre class="logbox" id="logbox"></pre>
      </div>
    </section>
  </main>
</div>

<!-- toast -->
<div class="toast-wrap" id="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
